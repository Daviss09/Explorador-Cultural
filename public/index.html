<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SB Admin 2 – Layout base</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sprite de ícones SVG (viewBox 24x24, estilo traço) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
      <path d="M7.5 9h2.5"/>
      <path d="M15 9h.01"/>
    </symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24">
      <path d="m12 14 4-4"/>
      <path d="M3.34 19a10 10 0 1 1 17.32 0"/>
    </symbol>
    <symbol id="i-gear" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </symbol>
    <symbol id="i-folder" viewBox="0 0 24 24">
      <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
    </symbol>
    <symbol id="i-chart" viewBox="0 0 24 24">
      <path d="M3 3v18h18"/>
      <path d="m7 15 4-5 3 3 6-7"/>
    </symbol>
    <symbol id="i-table" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <path d="M3 9h18M3 15h18M9 3v18"/>
    </symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/>
      <path d="m21 21-4.35-4.35"/>
    </symbol>
    <symbol id="i-bell" viewBox="0 0 24 24">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </symbol>
    <symbol id="i-mail" viewBox="0 0 24 24">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <path d="m22 6-10 7L2 6"/>
    </symbol>
  </svg>

  <div id="wrapper">

    <!-- Barra lateral -->
    <aside class="sidebar" id="sidebar">
      <a class="sidebar-brand" href="#">
        <svg class="ico"><use href="#i-logo"/></svg>
        <span>SB Admin <sup>2</sup></span>
      </a>
      <hr>

      <ul>
        <li class="nav-item active">
          <a href="#"><svg class="ico icon"><use href="#i-gauge"/></svg><span>Dashboard</span></a>
        </li>
      </ul>
      <hr style="margin-top:.5rem">

      <div class="nav-heading">Interface</div>
      <ul>
        <li class="nav-item">
          <a href="#">
            <svg class="ico icon"><use href="#i-gear"/></svg><span>Components</span>
            <svg class="ico chevron"><use href="#i-chevron-right"/></svg>
          </a>
        </li>
        <li class="nav-item">
          <a href="#">
            <svg class="ico icon"><use href="#i-wrench"/></svg><span>Utilities</span>
            <svg class="ico chevron"><use href="#i-chevron-right"/></svg>
          </a>
        </li>
      </ul>
      <hr style="margin-top:.5rem">

      <div class="nav-heading">Addons</div>
      <ul>
        <li class="nav-item">
          <a href="#">
            <svg class="ico icon"><use href="#i-folder"/></svg><span>Pages</span>
            <svg class="ico chevron"><use href="#i-chevron-right"/></svg>
          </a>
        </li>
        <li class="nav-item">
          <a href="#"><svg class="ico icon"><use href="#i-chart"/></svg><span>Charts</span></a>
        </li>
        <li class="nav-item">
          <a href="#"><svg class="ico icon"><use href="#i-table"/></svg><span>Tables</span></a>
        </li>
      </ul>
      <hr style="margin-top:.5rem">

      <div class="toggle-wrap">
        <button class="toggle-btn" id="sidebarToggle" aria-label="Recolher barra lateral">
          <svg class="ico"><use href="#i-chevron-left"/></svg>
        </button>
      </div>
    </aside>

    <!-- Conteúdo -->
    <div id="content-wrapper">

      <!-- Cabeçalho -->
      <header class="topbar">
        <form class="search" role="search" onsubmit="return false">
          <input type="search" placeholder="Search for..." aria-label="Pesquisar">
          <button type="submit" aria-label="Pesquisar"><svg class="ico"><use href="#i-search"/></svg></button>
        </form>

        <div class="topbar-right">
          <a class="topbar-icon" href="#" aria-label="Alertas">
            <svg class="ico"><use href="#i-bell"/></svg><span class="badge">3+</span>
          </a>
          <a class="topbar-icon" href="#" aria-label="Mensagens">
            <svg class="ico"><use href="#i-mail"/></svg><span class="badge">7</span>
          </a>
          <div class="divider"></div>
          <a class="user" href="#">
            <span>Valerie Luna</span>
            <img src="https://i.pravatar.cc/64?img=47" alt="Foto de Valerie Luna">
          </a>
        </div>
      </header>

      <!-- Área de conteúdo -->
      <main>
        <h1>Dashboard</h1>
      </main>
    </div>
  </div>

  <script>
    const sidebar = document.getElementById('sidebar');
    document.getElementById('sidebarToggle').addEventListener('click', () => {
      sidebar.classList.toggle('toggled');
    });
  </script>
</body>
</html>
